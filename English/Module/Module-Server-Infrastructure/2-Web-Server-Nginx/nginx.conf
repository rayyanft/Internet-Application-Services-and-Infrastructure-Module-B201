# Practice server block. Place in your distribution's configuration path (e.g. /etc/nginx/sites-available/).
server {
    # Non-privileged port for safe development and local testing.
    listen 8080;

    # Match localhost hostname so local exercises do not intercept public domain requests.
    server_name localhost;

    # Root directory where Nginx locates static document assets.
    root /var/www/html;
    index index.html;

    # The location / directive handles incoming requests matching the root path.
    location / {
        try_files $uri $uri/ =404;
    }
}
