<!DOCTYPE html>
<!-- This minimal page demonstrates dynamic client-side interactions via JavaScript. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Fundamentals Exercise</title>
  <!-- The defer attribute defers script execution until HTML parsing has completed. -->
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Laboratory Information</h1>
    <p id="status">Click the button below to check laboratory status.</p>
    <button id="status-button" type="button">Check Status</button>
  </main>
</body>
</html>
