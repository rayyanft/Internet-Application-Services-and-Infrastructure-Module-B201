<!DOCTYPE html>
<!-- Contoh CDN ini praktis untuk belajar, bukan konfigurasi produksi. -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Layanan</title>
  <!-- Memuat Tailwind dari internet untuk latihan cepat. -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <!-- Utility class mengatur lebar, jarak, latar, dan sudut kartu. -->
  <main class="mx-auto mt-10 max-w-xl p-4">
    <article class="rounded-xl bg-white p-6 shadow-md">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">
        Laboratorium
      </p>
      <h1 class="mt-2 text-2xl font-bold">Ruang Praktikum</h1>
      <p class="mt-3 leading-relaxed">
        Lihat informasi layanan dan persiapkan kebutuhan praktikum Anda.
      </p>
      <!-- Hover memberi tanda visual bahwa tombol ini dapat digunakan. -->
      <a class="mt-5 inline-block rounded-lg bg-blue-700 px-4 py-2 text-white hover:bg-blue-800"
         href="#informasi">
        Baca informasi
      </a>
    </article>
  </main>
</body>
</html>
