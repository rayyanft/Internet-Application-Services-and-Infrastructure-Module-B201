# Contoh blok server latihan. Letakkan pada lokasi konfigurasi yang sesuai distro.
server {
    # Port nonproduksi untuk latihan; akses hanya di lingkungan yang diizinkan.
    listen 8080;

    # Host lokal agar contoh tidak mengklaim nama domain publik.
    server_name localhost;

    # Folder contoh berisi berkas index.html.
    root /var/www/html;
    index index.html;

    # location / menangani permintaan yang dimulai dari path root.
    location / {
        try_files $uri $uri/ =404;
    }
}
